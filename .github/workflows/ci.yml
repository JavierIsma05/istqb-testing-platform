name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: istqb_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d istqb_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.testing
      DB_NAME: istqb_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      SECRET_KEY: ci-only-secret
      AUTOMATION_ALLOWED_HOSTS: localhost,127.0.0.1,::1
      SELENIUM_HEADLESS: 'true'
      SELENIUM_TIMEOUT: '15'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements/dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python src/manage.py check
      - run: python src/manage.py migrate --noinput
      - run: pytest

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.production
          push: false
          tags: istqb-testing-platform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
