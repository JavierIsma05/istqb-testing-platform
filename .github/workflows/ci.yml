name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: istqb_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d istqb_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.testing
      DB_NAME: istqb_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      SECRET_KEY: ci-only-secret
      AUTOMATION_ALLOWED_HOSTS: localhost,127.0.0.1,::1
      SELENIUM_HEADLESS: 'true'
      SELENIUM_TIMEOUT: '15'
      SELENIUM_BASE_URL: http://127.0.0.1:8000/
      SELENIUM_EMAIL: qa@example.com
      SELENIUM_PASSWORD: Istqb2026.Temp!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements/dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python src/manage.py check
      - run: python src/manage.py migrate --noinput
      - name: Prepare Selenium QA data
        run: |
          python src/manage.py shell <<'PY'
          from datetime import date
          from apps.users.models import User
          from apps.projects.models import Project
          from apps.requirements.models import Requirement
          from apps.testplans.models import TestPlan
          from apps.testcases.models import TestCase
          from apps.executions.models import TestExecution

          user, _ = User.objects.get_or_create(
              email='qa@example.com',
              defaults={'first_name': 'QA', 'last_name': 'Automation', 'role': User.Roles.STUDENT},
          )
          user.first_name = 'QA'
          user.last_name = 'Automation'
          user.role = User.Roles.STUDENT
          user.is_active = True
          user.set_password('Istqb2026.Temp!')
          user.save()

          project, _ = Project.objects.get_or_create(
              code='E2E-CI',
              defaults={
                  'name': 'Proyecto E2E CI',
                  'description': 'Proyecto auxiliar para pruebas funcionales automatizadas de CI.',
                  'status': Project.Status.ACTIVE,
                  'start_date': date(date.today().year, 1, 1),
                  'end_date': date(date.today().year, 12, 31),
                  'created_by': user,
                  'tutor': user,
              },
          )
          project.created_by = user
          project.tutor = user
          project.status = Project.Status.ACTIVE
          project.start_date = date(date.today().year, 1, 1)
          project.end_date = date(date.today().year, 12, 31)
          project.save()
          project.members.add(user)

          requirement, _ = Requirement.objects.get_or_create(
              project=project,
              code='REQ-E2E-001',
              defaults={
                  'title': 'Requisito E2E',
                  'description': 'El sistema debe permitir ejecutar y registrar una prueba funcional.',
                  'acceptance_criteria': 'La ejecución se registra correctamente.',
                  'priority': Requirement.Priority.HIGH,
                  'status': Requirement.Status.APPROVED,
                  'created_by': user,
              },
          )
          requirement.title = 'Requisito E2E'
          requirement.description = 'El sistema debe permitir ejecutar y registrar una prueba funcional.'
          requirement.status = Requirement.Status.APPROVED
          requirement.save()

          plan, _ = TestPlan.objects.get_or_create(
              project=project,
              name='Plan E2E CI',
              defaults={
                  'version': '1.0',
                  'description': 'Plan auxiliar de Selenium.',
                  'objective': 'Validar el flujo funcional E2E.',
                  'scope': 'Flujo de pruebas funcionales.',
                  'strategy': 'Pruebas funcionales manuales.',
                  'environment': 'Chrome en Windows',
                  'responsibilities': 'QA Automation',
                  'estimation': '1 hora',
                  'start_date': date(date.today().year, 1, 1),
                  'end_date': date(date.today().year, 12, 31),
                  'created_by': user,
              },
          )
          plan.environment = 'Chrome en Windows'
          plan.start_date = date(date.today().year, 1, 1)
          plan.end_date = date(date.today().year, 12, 31)
          plan.save()

          case, _ = TestCase.objects.get_or_create(
              test_plan=plan,
              code='TC-E2E-001',
              defaults={
                  'requirement': requirement,
                  'title': 'Caso E2E Login',
                  'description': 'Caso auxiliar para Selenium.',
                  'technique': TestCase.Technique.EQUIVALENCE,
                  'level': TestCase.Level.SYSTEM,
                  'preconditions': 'Usuario registrado.',
                  'test_data': 'usuario=qa@example.com',
                  'steps': 'Abrir login => Se muestra el formulario\nIngresar credenciales validas => El sistema acepta los datos\nEnviar formulario => El usuario accede al dashboard',
                  'steps_data': [
                      {'number': 1, 'action': 'Abrir login', 'expected_result': 'Se muestra el formulario'},
                      {'number': 2, 'action': 'Ingresar credenciales validas', 'expected_result': 'El sistema acepta los datos'},
                      {'number': 3, 'action': 'Enviar formulario', 'expected_result': 'El usuario accede al dashboard'},
                  ],
                  'expected_result': 'El usuario accede al dashboard.',
                  'priority': TestCase.Priority.HIGH,
                  'status': TestCase.Status.PENDING,
                  'created_by': user,
              },
          )
          case.requirement = requirement
          case.save()

          TestExecution.objects.filter(test_case=case, environment='CI-preexisting').delete()
          TestExecution.objects.create(
              test_case=case,
              execution_type=TestExecution.ExecutionType.NORMAL,
              execution_mode=TestExecution.ExecutionMode.MANUAL,
              executed_by=user,
              result=TestExecution.Result.PASSED,
              actual_result='Ejecución previa disponible para pruebas de defectos.',
              environment='CI-preexisting',
              notes='Ejecución auxiliar para Selenium.',
          )
          print('Datos Selenium preparados:', user.email, project.code, requirement.code, plan.name, case.code)
          PY
      - name: Start Django for Selenium tests
        run: |
          nohup python src/manage.py runserver 127.0.0.1:8000 --noreload > django-ci.log 2>&1 &
          python - <<'PY'
          import time
          import urllib.request
          for _ in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=2) as response:
                      if response.status == 200:
                          break
              except Exception:
                  time.sleep(1)
          else:
              print(open('django-ci.log', encoding='utf-8').read())
              raise SystemExit('Django no inicio correctamente')
          PY
      - run: pytest
      - if: always()
        run: cat django-ci.log || true

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.production
          push: false
          tags: istqb-testing-platform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
