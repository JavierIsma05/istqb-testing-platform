[pytest]
DJANGO_SETTINGS_MODULE = config.settings.testing
pythonpath = src
python_files = tests.py test_*.py *_tests.py
addopts = -ra -v --cov=src/apps --cov=src/config --cov-report=term-missing:skip-covered --basetemp=.pytest_tmp
markers =
    unit: pruebas unitarias sin servicios externos
    integration: pruebas de integración con Django y base de datos
    playwright: pruebas de automatización con Playwright
    e2e: pruebas funcionales de navegador con Selenium
    postgres: pruebas que requieren PostgreSQL
