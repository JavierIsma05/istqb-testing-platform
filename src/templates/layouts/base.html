{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script>
        (function () {
            var storedTheme = localStorage.getItem('istqb-theme');
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            var theme = storedTheme || (prefersDark ? 'dark' : 'light');

            if (theme === 'dark') {
                document.documentElement.classList.add('theme-dark');
            }

            if (localStorage.getItem('istqb-sidebar') === 'collapsed') {
                document.documentElement.classList.add('sidebar-collapsed');
            }
        })();
    </script>

    <title>
        {% block title %}
            TestFlow ISTQB
        {% endblock %}
    </title>

    <link rel="icon" type="image/svg+xml" href="{% static 'images/brand/testflow-mark.svg' %}">
    <link rel="shortcut icon" type="image/svg+xml" href="{% static 'images/brand/testflow-mark.svg' %}">
    <link rel="apple-touch-icon" href="{% static 'images/brand/testflow-mark.svg' %}">

    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="{% static 'css/main.css' %}?v=20260802-calidad"
    >

    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    {% block extra_css %}{% endblock %}

</head>

<body class="{% block body_class %}{% endblock %}">

    {% block content %}
    {% endblock %}

    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- Main JS -->

    <script
        src="{% static 'js/main.js' %}?v=20260802-calidad">
    </script>

    {% block extra_js %}{% endblock %}

</body>
</html>
