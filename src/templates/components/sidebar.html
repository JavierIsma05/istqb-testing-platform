{% load static %}
<aside class="app-sidebar" data-sidebar-user="{{ request.user.pk|default:'anonymous' }}">
    <div class="sidebar-brand">
        <span class="brand-mark"><img src="{% static 'images/brand/testflow-mark.svg' %}" alt="TestFlow"></span>
        <span class="sidebar-brand-text">
            <strong>TestFlow<br>ISTQB</strong>
            <small>Testing Lifecycle</small>
        </span>
        <button class="sidebar-toggle" type="button" title="Condensar menú" aria-label="Condensar menú" data-sidebar-toggle>
            <i class="bi bi-chevron-left" data-sidebar-toggle-icon></i>
        </button>
    </div>

    <nav class="sidebar-nav" aria-label="Navegación principal">
        <!-- EXPANDED VIEW: Accordion sections -->
        <div class="sidebar-expanded">
            <section class="sidebar-group" data-sidebar-group="inicio">
                <button class="sidebar-group-toggle" type="button" data-sidebar-group-toggle aria-expanded="true" aria-controls="sidebar-group-inicio">
                    <i class="bi bi-house-door" aria-hidden="true"></i>
                    <span>Inicio</span>
                    <i class="bi bi-chevron-down sidebar-group-chevron" aria-hidden="true"></i>
                </button>
                <div class="sidebar-group-menu" id="sidebar-group-inicio">
                    <a class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}" href="{% url 'dashboard' %}" title="Dashboard"><i class="bi bi-grid"></i><span>Dashboard</span></a>
                    <a class="{% if request.resolver_match.namespace == 'projects' %}active{% endif %}" href="{% url 'projects:index' %}" title="Proyectos"><i class="bi bi-kanban"></i><span>Proyectos</span></a>
                </div>
            </section>

            <section class="sidebar-group" data-sidebar-group="diseno">
                <button class="sidebar-group-toggle" type="button" data-sidebar-group-toggle aria-expanded="false" aria-controls="sidebar-group-diseno">
                    <i class="bi bi-pencil-square" aria-hidden="true"></i>
                    <span>Diseño de pruebas</span>
                    <i class="bi bi-chevron-down sidebar-group-chevron" aria-hidden="true"></i>
                </button>
                <div class="sidebar-group-menu" id="sidebar-group-diseno">
                    <a class="{% if request.resolver_match.namespace == 'requirements' %}active{% endif %}" href="{% url 'requirements:index' %}" title="Requisitos"><i class="bi bi-file-earmark-text"></i><span>Requisitos</span></a>
                    <a class="{% if request.resolver_match.namespace == 'testplans' %}active{% endif %}" href="{% url 'testplans:index' %}" title="Plan de Pruebas"><i class="bi bi-clipboard-check"></i><span>Plan de Pruebas</span></a>
                    <a class="{% if request.resolver_match.namespace == 'testcases' %}active{% endif %}" href="{% url 'testcases:index' %}" title="Casos de Prueba"><i class="bi bi-file-check"></i><span>Casos de Prueba</span></a>
                </div>
            </section>

            <section class="sidebar-group" data-sidebar-group="ejecucion">
                <button class="sidebar-group-toggle" type="button" data-sidebar-group-toggle aria-expanded="false" aria-controls="sidebar-group-ejecucion">
                    <i class="bi bi-play-circle" aria-hidden="true"></i>
                    <span>Ejecución y control</span>
                    <i class="bi bi-chevron-down sidebar-group-chevron" aria-hidden="true"></i>
                </button>
                <div class="sidebar-group-menu" id="sidebar-group-ejecucion">
                    <a class="{% if request.resolver_match.namespace == 'executions' %}active{% endif %}" href="{% url 'executions:index' %}" title="Ejecución"><i class="bi bi-play"></i><span>Ejecución</span></a>
                    <a class="{% if request.resolver_match.namespace == 'defects' %}active{% endif %}" href="{% url 'defects:index' %}" title="Defectos"><i class="bi bi-bug"></i><span>Defectos</span></a>
                    <a class="{% if request.resolver_match.namespace == 'traceability' %}active{% endif %}" href="{% url 'traceability:index' %}" title="Trazabilidad"><i class="bi bi-diagram-2"></i><span>Trazabilidad</span></a>
                </div>
            </section>

            <section class="sidebar-group" data-sidebar-group="informes">
                <button class="sidebar-group-toggle" type="button" data-sidebar-group-toggle aria-expanded="false" aria-controls="sidebar-group-informes">
                    <i class="bi bi-bar-chart-line" aria-hidden="true"></i>
                    <span>Informes y métricas</span>
                    <i class="bi bi-chevron-down sidebar-group-chevron" aria-hidden="true"></i>
                </button>
                <div class="sidebar-group-menu" id="sidebar-group-informes">
                    <a class="{% if request.resolver_match.namespace == 'reports' and request.resolver_match.url_name == 'index' %}active{% endif %}" href="{% url 'reports:index' %}" title="Informes"><i class="bi bi-bar-chart"></i><span>Informes</span></a>
                    <a class="{% if request.resolver_match.url_name == 'quality-metrics' %}active{% endif %}" href="{% url 'reports:quality-metrics' %}" title="Métricas de calidad"><i class="bi bi-speedometer2"></i><span>Métricas</span></a>
                    {% if request.user.role == 'ADMIN' %}
                    <a class="{% if request.resolver_match.namespace == 'audit' %}active{% endif %}" href="{% url 'audit:index' %}" title="Auditoría"><i class="bi bi-shield-check"></i><span>Auditoría</span></a>
                    {% endif %}
                </div>
            </section>
        </div>

        <!-- CONDENSED VIEW: Flat grid of all items -->
        <div class="sidebar-condensed" aria-hidden="true">
            <a class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}" href="{% url 'dashboard' %}" title="Dashboard" data-nav-item="dashboard"><i class="bi bi-grid" aria-hidden="true"></i></a>
            <a class="{% if request.resolver_match.namespace == 'projects' %}active{% endif %}" href="{% url 'projects:index' %}" title="Proyectos" data-nav-item="proyectos"><i class="bi bi-kanban" aria-hidden="true"></i></a>
            <a class="{% if request.resolver_match.namespace == 'requirements' %}active{% endif %}" href="{% url 'requirements:index' %}" title="Requisitos" data-nav-item="requisitos"><i class="bi bi-file-earmark-text" aria-hidden="true"></i></a>
            <a class="{% if request.resolver_match.namespace == 'testplans' %}active{% endif %}" href="{% url 'testplans:index' %}" title="Plan de Pruebas" data-nav-item="plan-pruebas"><i class="bi bi-clipboard-check" aria-hidden="true"></i></a>
            <a class="{% if request.resolver_match.namespace == 'testcases' %}active{% endif %}" href="{% url 'testcases:index' %}" title="Casos de Prueba" data-nav-item="casos"><i class="bi bi-file-check" aria-hidden="true"></i></a>
            <a class="{% if request.resolver_match.namespace == 'executions' %}active{% endif %}" href="{% url 'executions:index' %}" title="Ejecución" data-nav-item="ejecucion"><i class="bi bi-play" aria-hidden="true"></i></a>
            <a class="{% if request.resolver_match.namespace == 'defects' %}active{% endif %}" href="{% url 'defects:index' %}" title="Defectos" data-nav-item="defectos"><i class="bi bi-bug" aria-hidden="true"></i></a>
            <a class="{% if request.resolver_match.namespace == 'traceability' %}active{% endif %}" href="{% url 'traceability:index' %}" title="Trazabilidad" data-nav-item="trazabilidad"><i class="bi bi-diagram-2" aria-hidden="true"></i></a>
            <a class="{% if request.resolver_match.namespace == 'reports' and request.resolver_match.url_name == 'index' %}active{% endif %}" href="{% url 'reports:index' %}" title="Informes" data-nav-item="informes"><i class="bi bi-bar-chart" aria-hidden="true"></i></a>
            <a class="{% if request.resolver_match.url_name == 'quality-metrics' %}active{% endif %}" href="{% url 'reports:quality-metrics' %}" title="Métricas de calidad" data-nav-item="metricas"><i class="bi bi-speedometer2" aria-hidden="true"></i></a>
            {% if request.user.role == 'ADMIN' %}
            <a class="{% if request.resolver_match.namespace == 'audit' %}active{% endif %}" href="{% url 'audit:index' %}" title="Auditoría" data-nav-item="auditoria"><i class="bi bi-shield-check" aria-hidden="true"></i></a>
            {% endif %}
        </div>
    </nav>

    <button class="sidebar-mobile-toggle" type="button" title="Expandir menú" aria-label="Expandir menú" data-sidebar-toggle>
        <i class="bi bi-list"></i>
    </button>
</aside>
