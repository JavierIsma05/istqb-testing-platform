<nav class="app-navbar">
    <div>
        <h1>Sistema de Gestión de Pruebas</h1>
        <p>Plataforma ISTQB</p>
    </div>

    <div class="navbar-actions">
        <button class="icon-button" type="button" title="Cambiar tema" aria-label="Cambiar tema" data-theme-toggle>
            <i class="bi bi-moon" data-theme-icon></i>
        </button>
        {% with unread_notifications_count=request.user.unread_notifications_count %}
        <a class="icon-button {% if unread_notifications_count %}has-alert{% endif %}" href="{% url 'notifications:index' %}" title="Notificaciones" aria-label="Notificaciones">
            <i class="bi bi-bell"></i>
            <span class="visually-hidden">{{ unread_notifications_count }} notificaciones sin leer</span>
        </a>
        {% endwith %}
        <div class="dropdown">
            <button class="user-menu" data-bs-toggle="dropdown" type="button">
                <span class="avatar">{{ request.user.first_name|first|default:'U' }}{{ request.user.last_name|first }}</span>
                <span class="user-copy">
                    <strong>{{ request.user.get_full_name|default:request.user.email }}</strong>
                    <small>{{ request.user.get_role_display }}</small>
                    {% if navbar_phase_progress %}
                    <span class="navbar-phase-progress" title="Avance general del ciclo de pruebas">
                        <span class="navbar-phase-progress-label">Fases {{ navbar_phase_progress.percentage }}%</span>
                        <span class="navbar-phase-progress-track" aria-hidden="true">
                            <span class="navbar-phase-progress-bar navbar-phase-progress-{{ navbar_phase_progress.tone }}" style="width: {{ navbar_phase_progress.percentage }}%"></span>
                        </span>
                    </span>
                    {% endif %}
                </span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="{% url 'users:profile' %}">Perfil</a></li>
                <li>
                    <form method="post" action="{% url 'logout' %}" class="m-0">
                        {% csrf_token %}
                        <button type="submit" class="dropdown-item">Cerrar sesión</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>
